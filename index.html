<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Architect | Precision Document Synthesis</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* Industrial Precision Palette */
            --accent-primary: #007AFF;
            --accent-glow: rgba(0, 122, 255, 0.4);
            --bg-deep: #050505;
            --bg-surface: #111111;
            --bg-card: #181818;
            --text-main: #FFFFFF;
            --text-muted: #888888;
            --border-thin: rgba(255, 255, 255, 0.1);
            
            /* Typography Scale */
            --font-brand: 'Syne', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --font-ui: 'Inter', sans-serif;
            
            --ease-cinematic: cubic-bezier(0.16, 1, 0.3, 1);
            --transition: 0.4s var(--ease-cinematic);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-ui);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Custom Scrollbar for the Architect */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-primary); }

        /* ==========================================================================
           1. LAYOUT ARCHITECTURE
           ========================================================================== */
        .app-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        @media (max-width: 1024px) {
            .app-container { grid-template-columns: 1fr; overflow-y: auto; height: auto; }
        }

        /* ==========================================================================
           2. EDITOR INTERFACE (LEFT)
           ========================================================================== */
        .editor-pane {
            padding: 40px;
            background: var(--bg-surface);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-thin);
            height: 100vh;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .logo-box {
            width: 40px; height: 40px;
            background: var(--accent-primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .brand-title {
            font-family: var(--font-brand);
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .editor-container {
            flex-grow: 1;
            position: relative;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-thin);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* The High-Performance Textarea */
        #textInput {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            padding: 25px;
            color: #ccc;
            font-family: var(--font-mono);
            font-size: 1rem;
            resize: none;
            line-height: 1.8;
            scrollbar-width: none;
        }

        /* Formatting Toolbar */
        .toolbar {
            background: #202020;
            padding: 10px 20px;
            display: flex;
            gap: 20px;
            border-bottom: 1px solid var(--border-thin);
        }

        .tool-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.9rem;
        }

        .tool-btn:hover { color: #fff; transform: translateY(-2px); }

        /* ==========================================================================
           3. PREVIEW & SYNTHESIS PANE (RIGHT)
           ========================================================================== */
        .preview-pane {
            padding: 40px;
            background: var(--bg-deep);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        /* The Virtual PDF Sheet */
        .pdf-canvas-container {
            flex-grow: 1;
            background: #2a2a2a;
            border-radius: 12px;
            overflow-y: auto;
            padding: 40px;
            display: flex;
            justify-content: center;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
        }

        .pdf-page {
            width: 100%;
            max-width: 595px; /* A4 Ratio */
            min-height: 842px;
            background: white;
            color: #333;
            padding: 60px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            font-family: 'Times New Roman', serif;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        /* PDF Styling Elements (Rich Text) */
        .pdf-page b, .pdf-page strong { font-weight: 700; color: #000; }
        .pdf-page i, .pdf-page em { font-style: italic; }
        .pdf-page h1 { font-size: 2.5rem; margin-bottom: 1rem; border-bottom: 2px solid #eee; }
        .pdf-page h2 { font-size: 1.8rem; margin-top: 1.5rem; color: #444; }
        .pdf-page ul { margin-left: 20px; margin-bottom: 15px; }

        /* ==========================================================================
           4. ACTION CONTROLS
           ========================================================================== */
        .actions-row {
            margin-top: 30px;
            display: flex;
            gap: 15px;
        }

        .btn-main {
            padding: 15px 30px;
            border-radius: 50px;
            font-family: var(--font-brand);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-download {
            background: var(--accent-primary);
            color: #fff;
            border: none;
            box-shadow: 0 10px 20px var(--accent-glow);
        }

        .btn-download:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 30px var(--accent-glow);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--border-thin);
            color: #fff;
        }

        .btn-outline:hover { background: rgba(255,255,255,0.05); }

        /* ==========================================================================
           5. CREATOR SIGNATURE (SHASHANK_404_)
           ========================================================================== */
        .creator-tag {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            z-index: 100;
        }

        .creator-tag a {
            color: var(--accent-primary);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <section class="editor-pane">
            <header class="header-brand">
                <div class="logo-box"><i class="fa-solid fa-file-pdf"></i></div>
                <h1 class="brand-title">Architect</h1>
            </header>

            <div class="editor-container">
                <div class="toolbar">
                    <button class="tool-btn" onclick="insertFormat('**', '**')"><b>B</b></button>
                    <button class="tool-btn" onclick="insertFormat('*', '*')"><i>I</i></button>
                    <button class="tool-btn" onclick="insertFormat('# ', '')">H1</button>
                    <button class="tool-btn" onclick="insertFormat('- ', '')"><i class="fa-solid fa-list"></i></button>
                    <button class="tool-btn" onclick="insertFormat('> ', '')"><i class="fa-solid fa-quote-left"></i></button>
                </div>
                <textarea id="textInput" placeholder="Start your document synthesis here... Use *italic* or **bold** symbols."></textarea>
            </div>

            <div class="actions-row">
                <button class="btn-main btn-download" id="generatePdf">
                    <i class="fa-solid fa-bolt"></i> Synthesize PDF
                </button>
                <button class="btn-main btn-outline" id="clearEditor">
                    Clear Workspace
                </button>
            </div>
        </section>

        <section class="preview-pane">
            <div class="preview-header">
                <span style="text-transform: uppercase; font-size: 0.8rem; letter-spacing: 2px; color: var(--text-muted);">Real-time Synthesis Preview</span>
                <span id="charCount" style="color: var(--accent-primary); font-family: var(--font-mono);">0 chars</span>
            </div>
            
            <div class="pdf-canvas-container">
                <div class="pdf-page" id="pdfPreview">
                    </div>
            </div>
        </section>
    </div>

    <div class="creator-tag">
        ENGINEERED BY <a href="https://instagram.com/shashank_404_">@SHASHANK_404_</a>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>

    <script>
        /**
         * PDF ARCHITECT ENGINE v1.0
         * Logic for Real-time Markdown Parsing and High-DPI PDF Generation
         */

        const textInput = document.getElementById('textInput');
        const pdfPreview = document.getElementById('pdfPreview');
        const charCount = document.getElementById('charCount');

        // Configure Marked for Symbol Support (*, **, #, -, etc)
        marked.setOptions({
            breaks: true,
            gfm: true
        });

        // Real-time Parser
        textInput.addEventListener('input', () => {
            const rawText = textInput.value;
            pdfPreview.innerHTML = marked.parse(rawText);
            charCount.innerText = `${rawText.length} chars`;
        });

        // Insert Markdown Symbols into Selection
        function insertFormat(start, end) {
            const startPos = textInput.selectionStart;
            const endPos = textInput.selectionEnd;
            const selection = textInput.value.substring(startPos, endPos);
            const replacement = start + selection + end;
            
            textInput.value = textInput.value.substring(0, startPos) + replacement + textInput.value.substring(endPos);
            textInput.dispatchEvent(new Event('input'));
            textInput.focus();
        }

        // High-Quality PDF Synthesis
        document.getElementById('generatePdf').addEventListener('click', () => {
            if (!textInput.value.trim()) {
                alert("The workspace is empty. Synthesizing air is not yet supported.");
                return;
            }

            const element = document.getElementById('pdfPreview');
            const opt = {
                margin:       [1, 1, 1, 1], // Inches
                filename:     'Architect_Document.pdf',
                image:        { type: 'jpeg', quality: 1.0 }, // Maximum Quality
                html2canvas:  { 
                    scale: 4, // Ultra-High DPI Scaling
                    useCORS: true, 
                    letterRendering: true 
                },
                jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
            };

            // Start Synthesis Animation Effect (Optional visual)
            const btn = document.getElementById('generatePdf');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Synthesizing...';
            
            html2pdf().set(opt).from(element).save().then(() => {
                btn.innerHTML = '<i class="fa-solid fa-bolt"></i> Synthesize PDF';
            });
        });

        // Workspace Clear
        document.getElementById('clearEditor').addEventListener('click', () => {
            if(confirm("Wipe all document data? This cannot be undone.")) {
                textInput.value = '';
                pdfPreview.innerHTML = '';
                charCount.innerText = '0 chars';
            }
        });

        // Initial Placeholder text to showcase symbols
        textInput.value = "# PDF Architect 2026\n\n**Professional High-Quality PDF Generator**\n\n- Support for **Bold** using `**` symbols.\n- Support for *Italic* using `*` symbols.\n- Clean A4 Typography.\n- Ultra-DPI 4.0 Scaling.\n\n> Engineered for high-performance synthesis.\n\nDesigned by **@shashank_404_**";
        textInput.dispatchEvent(new Event('input'));

    </script>
</body>
    </html>
