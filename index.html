<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Future Sustainable City — Cinematic Experience</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
/* ================= GLOBAL RESET ================= */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* ================= BODY ================= */
body {
  font-family: 'Orbitron', sans-serif;
  overflow-x: hidden;
  background: #000;
  color: white;
}

/* ================= CANVAS ================= */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  outline: none;
}

/* ================= SCROLL AREA ================= */
.scroll-area {
  height: 600vh;
}

/* ================= UI OVERLAY ================= */
.ui {
  position: fixed;
  top: 30px;
  left: 30px;
  z-index: 10;
  max-width: 300px;
}

.card {
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(20px);
  padding: 20px;
  border-radius: 16px;
  margin-bottom: 15px;
  border: 1px solid rgba(255,255,255,0.1);
  transition: 0.4s;
}

.card:hover {
  transform: scale(1.05);
  border-color: #00ffcc;
}

.title {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 5px;
}

.subtitle {
  font-size: 13px;
  opacity: 0.7;
}

/* ================= AI ASSISTANT ================= */
.ai-assistant {
  position: fixed;
  bottom: 30px;
  right: 30px;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle, #00ffc3, transparent);
  box-shadow: 0 0 50px #00ffc3;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); opacity: 0.7; }
  50% { transform: scale(1.2); opacity: 1; }
  100% { transform: scale(1); opacity: 0.7; }
}

/* ================= TEXT OVERLAY ================= */
.story-text {
  position: fixed;
  bottom: 50px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 20px;
  text-align: center;
  max-width: 600px;
  opacity: 0;
  transition: 0.5s;
}
</style>
</head>

<body>

<div class="ui">
  <div class="card">
    <div class="title">🌍 Future City</div>
    <div class="subtitle">Scroll to evolve the world</div>
  </div>
</div>

<div class="ai-assistant"></div>
<div class="story-text" id="storyText"></div>

<div class="scroll-area"></div>

<script type="module">
  /* =========================================================
   PART 2 — LIVING CITY SYSTEM (TREES + ROADS + TRAFFIC)
   ========================================================= */

/* ================= TREE SYSTEM ================= */
const trees = [];

function createTree(x, z) {
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.1, 0.15, 1),
    new THREE.MeshStandardMaterial({ color: 0x8b5a2b })
  );

  const leaves = new THREE.Mesh(
    new THREE.SphereGeometry(0.6, 16, 16),
    new THREE.MeshStandardMaterial({
      color: 0x00ff88,
      emissive: 0x003322,
      roughness: 0.6
    })
  );

  leaves.position.y = 1;

  const tree = new THREE.Group();
  tree.add(trunk);
  tree.add(leaves);

  tree.position.set(x, 0, z);
  tree.scale.set(0.01, 0.01, 0.01); // start tiny

  scene.add(tree);
  trees.push(tree);
}

// generate trees
for (let i = 0; i < 80; i++) {
  createTree(
    (Math.random() - 0.5) * 50,
    (Math.random() - 0.5) * 50
  );
}

/* ================= ROADS ================= */
const roadMaterial = new THREE.MeshStandardMaterial({
  color: 0x222222,
  roughness: 0.9
});

for (let i = -50; i <= 50; i += 10) {
  const road = new THREE.Mesh(
    new THREE.PlaneGeometry(100, 2),
    roadMaterial
  );
  road.rotation.x = -Math.PI / 2;
  road.position.z = i;
  scene.add(road);
}

/* ================= TRAFFIC SYSTEM ================= */
const cars = [];

function createCar() {
  const car = new THREE.Mesh(
    new THREE.BoxGeometry(1, 0.5, 2),
    new THREE.MeshStandardMaterial({
      color: new THREE.Color(Math.random(), Math.random(), Math.random()),
      emissive: 0x111111
    })
  );

  car.position.set(-50, 0.25, (Math.random() - 0.5) * 50);
  scene.add(car);
  cars.push(car);
}

// generate cars
for (let i = 0; i < 20; i++) {
  createCar();
}

/* ================= DRONES ================= */
const drones = [];

function createDrone() {
  const drone = new THREE.Mesh(
    new THREE.SphereGeometry(0.3, 16, 16),
    new THREE.MeshStandardMaterial({
      color: 0x00ffff,
      emissive: 0x00ffff
    })
  );

  drone.position.set(
    (Math.random() - 0.5) * 40,
    5 + Math.random() * 5,
    (Math.random() - 0.5) * 40
  );

  scene.add(drone);
  drones.push(drone);
}

// create drones
for (let i = 0; i < 15; i++) createDrone();

/* ================= PARTICLE SYSTEM ================= */
const particleCount = 2000;

const particlesGeometry = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);

for (let i = 0; i < particleCount; i++) {
  positions[i * 3] = (Math.random() - 0.5) * 100;
  positions[i * 3 + 1] = Math.random() * 10;
  positions[i * 3 + 2] = (Math.random() - 0.5) * 100;
}

particlesGeometry.setAttribute(
  "position",
  new THREE.BufferAttribute(positions, 3)
);

const particlesMaterial = new THREE.PointsMaterial({
  color: 0x888888,
  size: 0.1,
  transparent: true
});

const particles = new THREE.Points(particlesGeometry, particlesMaterial);
scene.add(particles);

/* ================= ENERGY BEAMS ================= */
const beams = [];

for (let i = 0; i < 30; i++) {
  const beam = new THREE.Mesh(
    new THREE.CylinderGeometry(0.05, 0.05, 5),
    new THREE.MeshStandardMaterial({
      color: 0x00ffcc,
      emissive: 0x00ffcc,
      transparent: true,
      opacity: 0.3
    })
  );

  beam.position.set(
    (Math.random() - 0.5) * 40,
    2.5,
    (Math.random() - 0.5) * 40
  );

  scene.add(beam);
  beams.push(beam);
}

/* ================= UPDATE EXTENSIONS ================= */

// Extend your existing updateScene()
const originalUpdateScene = updateScene;

updateScene = function(progress) {

  originalUpdateScene(progress);

  // 🌳 TREE GROWTH
  trees.forEach((t) => {
    const scale = Math.max(0.01, progress * 2);
    t.scale.set(scale, scale, scale);
  });

  // 🚗 CAR SPEED
  cars.forEach((c) => {
    c.position.x += 0.1 + progress * 0.5;
    if (c.position.x > 50) c.position.x = -50;
  });

  // 🛸 DRONE MOVEMENT
  drones.forEach((d, i) => {
    d.position.x += Math.sin(Date.now() * 0.001 + i) * 0.05;
    d.position.z += Math.cos(Date.now() * 0.001 + i) * 0.05;
  });

  // 🌫️ POLLUTION → CLEAN
  particlesMaterial.color.setRGB(
    0.5 - progress * 0.5,
    0.5 + progress * 0.5,
    0.5 - progress * 0.3
  );

  particlesMaterial.opacity = 1 - progress;

  // ⚡ ENERGY ACTIVATION
  beams.forEach((b) => {
    b.material.opacity = progress * 0.8;
    b.scale.y = progress * 2;
  });
};

/* ================= AI ASSISTANT REACTION ================= */
const ai = document.querySelector(".ai-assistant");

window.addEventListener("scroll", () => {
  const glow = 20 + scrollProgress * 80;
  ai.style.boxShadow = `0 0 ${glow}px #00ffc3`;
});
  /* =========================================================
   PART 3 — CINEMATIC SYSTEM + AI + REALISM CORE
   ========================================================= */

/* ================= GSAP SCROLL TIMELINE ================= */
let timeline = gsap.timeline({
  paused: true
});

// Camera cinematic path
timeline.to(camera.position, {
  x: 5,
  y: 4,
  z: 3,
  duration: 1
});

timeline.to(camera.position, {
  x: -4,
  y: 6,
  z: 2,
  duration: 1
});

timeline.to(camera.position, {
  x: 0,
  y: 8,
  z: 1,
  duration: 1
});

// Sync with scroll
window.addEventListener("scroll", () => {
  timeline.progress(scrollProgress);
});

/* ================= SKY + SUN SYSTEM ================= */
const skyColor = new THREE.Color();

function updateSky(progress) {
  skyColor.setRGB(
    0.1 + progress * 0.3,
    0.1 + progress * 0.6,
    0.2 + progress * 0.8
  );

  renderer.setClearColor(skyColor);

  directional.color.setRGB(
    1,
    0.8 + progress * 0.2,
    0.6 + progress * 0.4
  );

  directional.intensity = 1 + progress * 2;
}

/* ================= REAL MODEL LOADER (GLTF READY) ================= */
import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/loaders/GLTFLoader.js";

const loader = new GLTFLoader();

// Placeholder for future GTA-level models
function loadCityModel() {
  loader.load(
    "https://threejs.org/examples/models/gltf/DamagedHelmet/glTF/DamagedHelmet.gltf",
    (gltf) => {
      const model = gltf.scene;

      model.scale.set(2, 2, 2);
      model.position.set(0, 2, 0);

      scene.add(model);
    }
  );
}

loadCityModel();

/* ================= AI ASSISTANT SYSTEM ================= */
const aiText = document.getElementById("storyText");

const messages = [
  "Initializing city diagnostics...",
  "Pollution levels critical...",
  "Activating green protocols...",
  "Urban ecosystems regenerating...",
  "Sustainable future achieved 🌱"
];

let currentMessage = 0;

function typeText(text, element, speed = 30) {
  element.innerHTML = "";
  let i = 0;

  function typing() {
    if (i < text.length) {
      element.innerHTML += text.charAt(i);
      i++;
      setTimeout(typing, speed);
    }
  }

  typing();
}

// Trigger AI messages based on scroll
window.addEventListener("scroll", () => {
  const index = Math.floor(scrollProgress * messages.length);

  if (index !== currentMessage && messages[index]) {
    currentMessage = index;
    typeText(messages[index], aiText);
    aiText.style.opacity = 1;
  }
});

/* ================= VOICE SYNTHESIS ================= */
function speak(text) {
  const speech = new SpeechSynthesisUtterance(text);
  speech.rate = 1;
  speech.pitch = 1.2;
  speech.volume = 1;
  speechSynthesis.speak(speech);
}

// Speak at key moments
window.addEventListener("scroll", () => {
  if (scrollProgress > 0.5 && scrollProgress < 0.52) {
    speak("Sustainable systems activated");
  }
});

/* ================= BACKGROUND SOUND ================= */
const audio = new Audio(
  "https://cdn.pixabay.com/audio/2022/03/15/audio_115b9b7d06.mp3"
);

audio.loop = true;
audio.volume = 0.3;

// Play on interaction (browser policy safe)
window.addEventListener("click", () => {
  audio.play();
});

/* ================= ADVANCED ANIMATION LOOP ================= */
const clock = new THREE.Clock();

function advancedAnimate() {
  const delta = clock.getDelta();

  // subtle camera breathing
  camera.position.y += Math.sin(Date.now() * 0.001) * 0.002;

  // energy beam pulse
  beams.forEach((b, i) => {
    b.scale.y = 1 + Math.sin(Date.now() * 0.002 + i) * 0.5;
  });

  // particles drift
  particles.rotation.y += 0.0005;

  updateSky(scrollProgress);
}

/* ================= HOOK INTO MAIN LOOP ================= */
const oldAnimate = animate;

animate = function () {
  requestAnimationFrame(animate);

  advancedAnimate();

  oldAnimate();
};

/* ================= INTERACTIVE HOTSPOTS ================= */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener("click", (event) => {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const intersects = raycaster.intersectObjects(buildings);

  if (intersects.length > 0) {
    const obj = intersects[0].object;

    gsap.to(obj.scale, {
      y: obj.scale.y + 2,
      duration: 0.5
    });

    typeText("Energy upgraded ⚡", aiText);
  }
});

/* ================= PERFORMANCE OPTIMIZATION ================= */
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

buildings.forEach((b) => {
  b.castShadow = true;
  b.receiveShadow = true;
});

directional.castShadow = true;
  /* =========================================================
   PART 4 — FINAL GOD LEVEL SYSTEM
   ========================================================= */

/* ================= DAY / NIGHT SYSTEM ================= */
let dayNight = 0;

function updateDayNight(progress) {
  dayNight = progress;

  // Sky shift to night
  const nightFactor = Math.max(0, progress - 0.6) * 2.5;

  renderer.setClearColor(
    new THREE.Color(
      0.1 - nightFactor * 0.1,
      0.2 - nightFactor * 0.2,
      0.4 - nightFactor * 0.3
    )
  );

  // Neon lights activate
  buildings.forEach((b) => {
    b.material.emissive.setRGB(
      nightFactor * 0.2,
      nightFactor * 0.8,
      nightFactor
    );
  });
}

/* ================= WATER SYSTEM ================= */
const water = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({
    color: 0x001e2f,
    metalness: 0.8,
    roughness: 0.2
  })
);

water.rotation.x = -Math.PI / 2;
water.position.y = -0.1;
scene.add(water);

/* ================= TRAFFIC LANES ================= */
const lanes = [];

for (let i = -40; i <= 40; i += 8) {
  const lane = new THREE.Mesh(
    new THREE.PlaneGeometry(100, 0.2),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );

  lane.rotation.x = -Math.PI / 2;
  lane.position.z = i;
  lane.position.y = 0.01;

  scene.add(lane);
  lanes.push(lane);
}

/* ================= TRAFFIC LIGHT SYSTEM ================= */
const trafficLights = [];

function createTrafficLight(x, z) {
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.1, 0.1, 3),
    new THREE.MeshStandardMaterial({ color: 0x333333 })
  );

  const light = new THREE.Mesh(
    new THREE.SphereGeometry(0.3),
    new THREE.MeshStandardMaterial({
      color: 0xff0000,
      emissive: 0xff0000
    })
  );

  light.position.y = 1.5;

  const group = new THREE.Group();
  group.add(pole);
  group.add(light);

  group.position.set(x, 0, z);

  scene.add(group);
  trafficLights.push(light);
}

// create lights
for (let i = 0; i < 10; i++) {
  createTrafficLight(
    (Math.random() - 0.5) * 40,
    (Math.random() - 0.5) * 40
  );
}

/* ================= SMART TRAFFIC ================= */
function updateTraffic(progress) {
  const speed = 0.1 + progress;

  cars.forEach((c, i) => {
    c.position.x += speed;

    if (c.position.x > 50) c.position.x = -50;

    // stop at lights randomly
    if (Math.random() < 0.002) {
      c.position.x -= speed * 5;
    }
  });

  // light switching
  trafficLights.forEach((l, i) => {
    const t = Math.sin(Date.now() * 0.002 + i);

    if (t > 0) {
      l.material.color.set(0x00ff00);
      l.material.emissive.set(0x00ff00);
    } else {
      l.material.color.set(0xff0000);
      l.material.emissive.set(0xff0000);
    }
  });
}

/* ================= MOBILE OPTIMIZATION ================= */
function optimizeForMobile() {
  if (window.innerWidth < 768) {
    renderer.setPixelRatio(1);

    particlesMaterial.size = 0.05;

    drones.forEach(d => d.visible = false);
  }
}

optimizeForMobile();

/* ================= AI COMMAND SYSTEM ================= */
window.addEventListener("keydown", (e) => {

  if (e.key === "g") {
    typeText("Activating green mode 🌱", aiText);

    trees.forEach(t => t.scale.set(2,2,2));
  }

  if (e.key === "n") {
    typeText("Night mode enabled 🌌", aiText);

    scrollProgress = 0.9;
    updateDayNight(scrollProgress);
  }

  if (e.key === "e") {
    typeText("Energy surge activated ⚡", aiText);

    beams.forEach(b => {
      b.material.opacity = 1;
      b.scale.y = 5;
    });
  }
});

/* ================= ULTRA EFFECTS ================= */
function ultraEffects() {

  // water shimmer
  water.material.opacity = 0.8 + Math.sin(Date.now() * 0.002) * 0.1;

  // neon pulse
  buildings.forEach((b, i) => {
    b.material.emissiveIntensity =
      0.2 + Math.sin(Date.now() * 0.003 + i) * 0.3;
  });

  // drone glow pulse
  drones.forEach((d, i) => {
    d.material.emissiveIntensity =
      1 + Math.sin(Date.now() * 0.005 + i);
  });
}

/* ================= EXTEND MAIN UPDATE ================= */
const prevUpdateScene = updateScene;

updateScene = function(progress) {

  prevUpdateScene(progress);

  updateDayNight(progress);
  updateTraffic(progress);
};

/* ================= FINAL LOOP HOOK ================= */
const prevAdvanced = advancedAnimate;

advancedAnimate = function() {

  prevAdvanced();

  ultraEffects();
};
  /* =========================================================
   PART 5 — ULTRA PRO MAX SYSTEM
   ========================================================= */

/* ================= AI CHAT UI ================= */
const chatUI = document.createElement("div");
chatUI.style.position = "fixed";
chatUI.style.bottom = "20px";
chatUI.style.left = "20px";
chatUI.style.width = "300px";
chatUI.style.height = "350px";
chatUI.style.background = "rgba(0,0,0,0.7)";
chatUI.style.backdropFilter = "blur(15px)";
chatUI.style.borderRadius = "12px";
chatUI.style.padding = "10px";
chatUI.style.zIndex = "999";

chatUI.innerHTML = `
  <div style="height:85%; overflow-y:auto;" id="chatBox"></div>
  <input id="chatInput" placeholder="Ask AI..." style="width:100%; padding:8px; border:none; outline:none; background:#111; color:white;">
`;

document.body.appendChild(chatUI);

const chatBox = document.getElementById("chatBox");
const chatInput = document.getElementById("chatInput");

// simple AI logic (expand later with real API)
function aiRespond(msg) {
  let response = "Processing...";

  if (msg.includes("energy")) response = "Renewable energy at 78% efficiency ⚡";
  if (msg.includes("pollution")) response = "Air quality improving rapidly 🌱";
  if (msg.includes("city")) response = "Smart city systems fully active";

  const div = document.createElement("div");
  div.innerText = "AI: " + response;
  chatBox.appendChild(div);
}

chatInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const msg = chatInput.value;

    const userMsg = document.createElement("div");
    userMsg.innerText = "You: " + msg;
    chatBox.appendChild(userMsg);

    aiRespond(msg);
    chatInput.value = "";
  }
});

/* ================= LIVE DATA SIMULATION ================= */
const dataPanel = document.createElement("div");
dataPanel.style.position = "fixed";
dataPanel.style.top = "20px";
dataPanel.style.right = "20px";
dataPanel.style.background = "rgba(0,0,0,0.6)";
dataPanel.style.padding = "15px";
dataPanel.style.borderRadius = "10px";
dataPanel.style.fontSize = "12px";

document.body.appendChild(dataPanel);

function updateData() {
  const energy = (60 + Math.random() * 40).toFixed(1);
  const pollution = (100 - scrollProgress * 100).toFixed(1);

  dataPanel.innerHTML = `
    ⚡ Energy: ${energy}%<br>
    🌫️ Pollution: ${pollution}%<br>
    🌱 Sustainability Index: ${(scrollProgress * 100).toFixed(1)}%
  `;
}

setInterval(updateData, 1000);

/* ================= WASD CONTROLS ================= */
const keys = {};

window.addEventListener("keydown", (e) => keys[e.key.toLowerCase()] = true);
window.addEventListener("keyup", (e) => keys[e.key.toLowerCase()] = false);

function movementControls() {
  const speed = 0.1;

  if (keys["w"]) camera.position.z -= speed;
  if (keys["s"]) camera.position.z += speed;
  if (keys["a"]) camera.position.x -= speed;
  if (keys["d"]) camera.position.x += speed;
}

/* ================= VR MODE ================= */
renderer.xr.enabled = true;

const vrButton = document.createElement("button");
vrButton.innerText = "ENTER VR";
vrButton.style.position = "fixed";
vrButton.style.bottom = "20px";
vrButton.style.right = "20px";
vrButton.style.padding = "10px";
vrButton.style.zIndex = "999";

document.body.appendChild(vrButton);

vrButton.addEventListener("click", async () => {
  if (navigator.xr) {
    const session = await navigator.xr.requestSession("immersive-vr");
    renderer.xr.setSession(session);
  } else {
    alert("VR not supported");
  }
});

/* ================= WORLD ZONES ================= */
const zones = [
  { name: "Industrial", color: 0x444444 },
  { name: "Green City", color: 0x00ff88 },
  { name: "Energy Hub", color: 0x00ccff }
];

function updateZones(progress) {
  const index = Math.floor(progress * zones.length);
  if (zones[index]) {
    scene.fog.color.set(zones[index].color);
  }
}

/* ================= COMMAND CONSOLE ================= */
const consoleInput = document.createElement("input");
consoleInput.placeholder = "Enter command...";
consoleInput.style.position = "fixed";
consoleInput.style.bottom = "0";
consoleInput.style.left = "50%";
consoleInput.style.transform = "translateX(-50%)";
consoleInput.style.width = "400px";
consoleInput.style.padding = "10px";
consoleInput.style.background = "#000";
consoleInput.style.color = "#0f0";
consoleInput.style.border = "none";

document.body.appendChild(consoleInput);

consoleInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const cmd = consoleInput.value.toLowerCase();

    if (cmd === "green") {
      trees.forEach(t => t.scale.set(3,3,3));
    }

    if (cmd === "night") {
      updateDayNight(1);
    }

    if (cmd === "boost") {
      beams.forEach(b => b.scale.y = 10);
    }

    consoleInput.value = "";
  }
});

/* ================= FINAL LOOP EXTENSION ================= */
const prevUltra = advancedAnimate;

advancedAnimate = function () {

  prevUltra();

  movementControls();
  updateZones(scrollProgress);
  updateData();
};
  /* =========================================================
   FINAL GOD MODE — MISSIONS + NPC + MULTIPLAYER ILLUSION
   ========================================================= */

/* ================= MISSION SYSTEM ================= */
const missions = [
  { text: "Reduce pollution below 50%", done: false },
  { text: "Activate green energy grid", done: false },
  { text: "Grow urban forest", done: false }
];

const missionUI = document.createElement("div");
missionUI.style.position = "fixed";
missionUI.style.top = "50%";
missionUI.style.left = "20px";
missionUI.style.transform = "translateY(-50%)";
missionUI.style.background = "rgba(0,0,0,0.6)";
missionUI.style.padding = "15px";
missionUI.style.borderRadius = "10px";

document.body.appendChild(missionUI);

function updateMissions() {
  missionUI.innerHTML = "<b>MISSIONS</b><br>";
  missions.forEach((m, i) => {
    missionUI.innerHTML += `${m.done ? "✅" : "⬜"} ${m.text}<br>`;
  });

  // auto complete based on state
  if (scrollProgress > 0.5) missions[0].done = true;
  if (scrollProgress > 0.7) missions[1].done = true;
  if (scrollProgress > 0.9) missions[2].done = true;
}

/* ================= NPC SYSTEM ================= */
const npcs = [];

function createNPC() {
  const npc = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.3, 1),
    new THREE.MeshStandardMaterial({ color: 0xffcc99 })
  );

  npc.position.set(
    (Math.random() - 0.5) * 30,
    1,
    (Math.random() - 0.5) * 30
  );

  scene.add(npc);
  npcs.push(npc);
}

// spawn NPCs
for (let i = 0; i < 20; i++) createNPC();

function updateNPCs() {
  npcs.forEach((npc, i) => {
    npc.position.x += Math.sin(Date.now() * 0.001 + i) * 0.02;
    npc.position.z += Math.cos(Date.now() * 0.001 + i) * 0.02;
  });
}

/* ================= MULTIPLAYER ILLUSION ================= */
const ghosts = [];

function createGhostUser() {
  const ghost = new THREE.Mesh(
    new THREE.SphereGeometry(0.3),
    new THREE.MeshStandardMaterial({
      color: 0x00ffff,
      transparent: true,
      opacity: 0.5
    })
  );

  ghost.position.set(
    (Math.random() - 0.5) * 40,
    2,
    (Math.random() - 0.5) * 40
  );

  scene.add(ghost);
  ghosts.push(ghost);
}

for (let i = 0; i < 10; i++) createGhostUser();

function updateGhosts() {
  ghosts.forEach((g, i) => {
    g.position.y = 2 + Math.sin(Date.now() * 0.002 + i);
  });
}

/* ================= ACHIEVEMENT SYSTEM ================= */
const achievements = [];

function unlockAchievement(text) {
  if (!achievements.includes(text)) {
    achievements.push(text);

    const popup = document.createElement("div");
    popup.innerText = "🏆 " + text;
    popup.style.position = "fixed";
    popup.style.top = "20px";
    popup.style.left = "50%";
    popup.style.transform = "translateX(-50%)";
    popup.style.background = "#000";
    popup.style.padding = "10px";
    popup.style.border = "1px solid #0f0";

    document.body.appendChild(popup);

    setTimeout(() => popup.remove(), 3000);
  }
}

// unlock based on progress
window.addEventListener("scroll", () => {
  if (scrollProgress > 0.5) unlockAchievement("Cleaner Air 🌫️");
  if (scrollProgress > 0.8) unlockAchievement("Green City 🌱");
});

    duration: 2
  });

  gsap.to(camera.rotation, {
    x: -0.5,
    duration: 2
  });

  typeText("Welcome to the future city...", aiText);
}

window.addEventListener("scroll", () => {

});

/* ================= IMPORTS ================= */
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js";
import { EffectComposer } from "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/postprocessing/EffectComposer.js";
import { RenderPass } from "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/postprocessing/UnrealBloomPass.js";

import gsap from "https://cdn.jsdelivr.net/npm/gsap@3.12.5/index.js";

/* ================= CORE ================= */
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(0, 2, 6);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "high-performance"
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000);

document.body.appendChild(renderer.domElement);

/* ================= POST PROCESSING ================= */
const composer = new EffectComposer(renderer);

const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  1.2,
  0.4,
  0.85
);
composer.addPass(bloomPass);

/* ================= LIGHTING ================= */
const ambient = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambient);

const directional = new THREE.DirectionalLight(0xffffff, 2);
directional.position.set(5, 10, 5);
scene.add(directional);

/* ================= FOG ================= */
scene.fog = new THREE.Fog(0x000000, 10, 40);

/* ================= CITY GENERATION ================= */
const buildings = [];

for (let i = 0; i < 120; i++) {
  const geo = new THREE.BoxGeometry(1, 1, 1);

  const mat = new THREE.MeshStandardMaterial({
    color: 0x222222,
    roughness: 0.9,
    metalness: 0.1
  });

  const mesh = new THREE.Mesh(geo, mat);

  mesh.position.x = (Math.random() - 0.5) * 30;
  mesh.position.z = (Math.random() - 0.5) * 30;
  mesh.position.y = Math.random() * 2;

  mesh.scale.y = Math.random() * 6 + 1;

  scene.add(mesh);
  buildings.push(mesh);
}

/* ================= GROUND ================= */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ color: 0x111111 })
);

ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/* ================= SCROLL PROGRESS ================= */
let scrollProgress = 0;

window.addEventListener("scroll", () => {
  const maxScroll = document.body.scrollHeight - window.innerHeight;
  scrollProgress = window.scrollY / maxScroll;

  updateScene(scrollProgress);
});

/* ================= STORY TEXT ================= */
const storyText = document.getElementById("storyText");

function updateStory(progress) {
  if (progress < 0.3) {
    storyText.innerText = "A world drowning in pollution...";
    storyText.style.opacity = 1;
  } else if (progress < 0.6) {
    storyText.innerText = "Humanity begins to change...";
  } else {
    storyText.innerText = "A sustainable future is born 🌱";
  }
}

/* ================= ENVIRONMENT EVOLUTION ================= */
function updateScene(progress) {

  // SKY COLOR
  const r = 0.05 + progress * 0.2;
  const g = 0.05 + progress * 0.5;
  const b = 0.05 + progress * 0.8;
  renderer.setClearColor(new THREE.Color(r, g, b));

  // FOG TRANSITION
  scene.fog.color.setRGB(r, g, b);

  // BUILDINGS TRANSFORM
  buildings.forEach((b) => {
    b.material.color.setRGB(
      0.2 + progress * 0.2,
      0.2 + progress * 0.8,
      0.2 + progress * 0.3
    );

    b.scale.y = 1 + progress * 8;
  });

  // CAMERA CINEMATIC MOVE
  camera.position.z = 6 - progress * 3;
  camera.position.y = 2 + progress * 3;

  updateStory(progress);
}

/* ================= ANIMATION LOOP ================= */
function animate() {
  requestAnimationFrame(animate);

  buildings.forEach((b) => {
    b.rotation.y += 0.001;
  });

  composer.render();
}
animate();

/* ================= RESIZE ================= */
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});

</script>
