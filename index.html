<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text to PDF Pro · Markdown + Hindi + symbols</title>
  <!-- Professional fonts: Latin & Devanagari (Hindi, mantras) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* --- modern reset & design system --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #f0f4f8 0%, #e9eef4 100%);
      font-family: 'Inter', 'Noto Sans Devanagari', system-ui, -apple-system, sans-serif;
      color: #1a2639;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      max-width: 1400px;
      width: 100%;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(4px);
      border-radius: 2.5rem;
      box-shadow: 0 30px 60px -20px rgba(0, 20, 40, 0.25),
                  0 0 0 1px rgba(156, 180, 204, 0.15) inset;
      overflow: hidden;
      transition: all 0.2s ease;
    }

    /* header */
    .header {
      background: #0f1a2f;
      padding: 2rem 2.5rem;
      color: white;
    }
    .header h1 {
      font-weight: 600;
      font-size: 2.4rem;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .header h1 span {
      background: #2d3b58;
      font-size: 1rem;
      font-weight: 500;
      padding: 0.2rem 1rem;
      border-radius: 40px;
      letter-spacing: 0.3px;
      color: #cbd5e1;
    }
    .header p {
      font-size: 1.1rem;
      color: #a9c1d9;
      margin-top: 0.5rem;
      max-width: 700px;
    }

    /* main grid */
    .workspace {
      padding: 2rem 2.5rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      background: #ffffffd9;
    }

    /* panels */
    .panel {
      background: #f9fcff;
      border-radius: 2rem;
      padding: 1.6rem 1.8rem;
      box-shadow: 0 8px 24px rgba(0, 30, 60, 0.05);
      border: 1px solid #e2edf7;
      transition: box-shadow 0.2s;
    }
    .panel:hover {
      box-shadow: 0 16px 32px rgba(0, 35, 70, 0.08);
    }

    .panel h2 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #10345e;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.2rem;
      border-bottom: 2px solid #dbe9f5;
      padding-bottom: 0.6rem;
    }

    /* editor textarea */
    #editor {
      width: 100%;
      height: 500px;
      padding: 1.5rem;
      font-family: 'Inter', 'Noto Sans Devanagari', 'SF Mono', 'Fira Code', monospace;
      font-size: 1rem;
      line-height: 1.7;
      background: white;
      border: 2px solid #dde7f0;
      border-radius: 1.8rem;
      resize: vertical;
      outline: none;
      transition: 0.2s;
      color: #0f2642;
    }
    #editor:focus {
      border-color: #3f6eb0;
      box-shadow: 0 0 0 4px rgba(57, 106, 176, 0.15);
    }

    /* live preview */
    .preview-box {
      height: 500px;
      overflow-y: auto;
      background: white;
      border-radius: 1.8rem;
      padding: 1.5rem;
      border: 2px solid #dde7f0;
      font-family: 'Inter', 'Noto Sans Devanagari', sans-serif;
      line-height: 1.7;
      word-wrap: break-word;
    }
    .preview-box > *:first-child { margin-top: 0; }
    .preview-box > *:last-child { margin-bottom: 0; }

    /* markdown preview styling */
    .preview-box h1 { font-size: 2em; margin: 0.8em 0 0.4em; font-weight: 650; color: #0c1f38; }
    .preview-box h2 { font-size: 1.6em; margin: 0.8em 0 0.4em; font-weight: 620; color: #153e6b; }
    .preview-box h3 { font-size: 1.3em; margin: 0.6em 0 0.3em; font-weight: 600; }
    .preview-box p { margin: 1em 0; }
    .preview-box strong { font-weight: 700; color: #0f2b4f; }
    .preview-box em { font-style: italic; }
    .preview-box code { background: #e9f0f7; padding: 0.2em 0.5em; border-radius: 10px; font-size: 0.9em; font-family: 'SF Mono', monospace; }
    .preview-box pre { background: #e9f0f7; padding: 1.2rem; border-radius: 20px; overflow-x: auto; border: 1px solid #cbddee; }
    .preview-box pre code { background: none; padding: 0; }
    .preview-box ul, .preview-box ol { padding-left: 2rem; margin: 1rem 0; }
    .preview-box blockquote { border-left: 5px solid #577faa; background: #f0f7ff; padding: 0.8rem 1.5rem; border-radius: 20px; margin: 1.5rem 0; color: #1f3f62; }
    .preview-box a { color: #1f5f9e; text-decoration: underline; text-underline-offset: 2px; }
    .preview-box img { max-width: 100%; border-radius: 16px; }

    /* button row */
    .action-bar {
      padding: 1.8rem 2.5rem 2.5rem;
      background: white;
      display: flex;
      flex-wrap: wrap;
      gap: 1.2rem;
      align-items: center;
      border-top: 2px solid #eaf1f9;
    }

    .btn {
      background: #10345e;
      color: white;
      border: none;
      padding: 0.9rem 2.2rem;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 60px;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 12px 20px -14px #0f2a4a;
      border: 1px solid #26558b;
    }
    .btn:hover {
      background: #1b4380;
      transform: translateY(-3px);
      box-shadow: 0 20px 25px -10px #0b2744;
    }
    .btn:active { transform: translateY(0); }
    .btn.secondary {
      background: white;
      color: #10345e;
      border: 2px solid #c7ddf2;
      box-shadow: none;
    }
    .btn.secondary:hover { background: #ecf5fd; border-color: #8eb9df; }

    .spinner {
      display: none;
      width: 1.2rem;
      height: 1.2rem;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.9s linear infinite;
    }
    .btn.loading .spinner { display: inline-block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .footnote {
      background: #e7f0fa;
      border-radius: 40px;
      padding: 0.8rem 2rem;
      font-size: 0.95rem;
      color: #1e3b60;
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem 2rem;
      margin-top: 0.5rem;
    }
    .footnote kbd {
      background: #cddef1;
      padding: 0.2rem 0.9rem;
      border-radius: 40px;
      font-family: 'Inter', monospace;
      font-weight: 600;
      color: #03223f;
    }

    /* responsive */
    @media (max-width: 800px) {
      .workspace { grid-template-columns: 1fr; }
      .header h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>
      ⚡ TEXT · TO · PDF PRO
      <span>Markdown + हिन्दी</span>
    </h1>
    <p>Professional formatting with **bold**, *italic*, `code`, lists, links, mantras, and every symbol. Hindi & English fully supported. Download as print‑ready PDF.</p>
  </div>

  <div class="workspace">
    <!-- INPUT PANEL -->
    <div class="panel">
      <h2>📝 EDITOR (Markdown syntax)</h2>
      <textarea id="editor" placeholder="Type or paste your content... use **bold** or __bold__, *italic*, `code`, etc.&#10;हिन्दी, ॐ, मंत्र, ©®™✓✗★ all work."># ॐ नमः शिवाय

This document demonstrates **professional** text-to-PDF conversion.

## ✨ Features
- **Bold** with `**` or `__`  
- *Italic* with `*` or `_`  
- `Inline code` and ```code blocks```
- [Hyperlinks](https://example.com)  
- हिन्दी समर्थन: **भारत**, *देवनागरी*, `संस्कृत मंत्र`  
- Special symbols: ©®™✓✗★ ♠♣♥♦ «» ‹› ∑∏∫

> “The quick brown fox jumps over the lazy dog” — includes **Devanagari**: ॐ भूर्भुवः स्वः तत्सवितुर्वरेण्यम् भर्गो देवस्य धीमहि धियो यो नः प्रचोदयात् ॥

## 📋 Example list
- **Bold item** with *nested italic*  
- हिन्दी आइटम: *कर्म* और **धर्म**  
- `monospace` and _emphasis_
