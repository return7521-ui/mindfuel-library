<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Future Sustainable City</title>

  <style>
    body {
      margin: 0;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
      background: #000;
      color: white;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
    }

    .scroll-container {
      height: 500vh;
      width: 100%;
    }

    .overlay {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
      max-width: 300px;
    }

    .card {
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 10px;
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .title {
      font-size: 20px;
      font-weight: bold;
    }

    .subtitle {
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

<div class="overlay">
  <div class="card">
    <div class="title">🌍 Future City</div>
    <div class="subtitle">Scroll to transform the world</div>
  </div>
</div>

<div class="scroll-container"></div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js";

let scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

let renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

camera.position.z = 5;

// Lighting
const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(5, 5, 5);
scene.add(light);

// Geometry (city blocks)
const geometry = new THREE.BoxGeometry();
let buildings = [];

for (let i = 0; i < 50; i++) {
  let material = new THREE.MeshStandardMaterial({ color: 0x444444 });
  let cube = new THREE.Mesh(geometry, material);

  cube.position.x = (Math.random() - 0.5) * 20;
  cube.position.y = Math.random() * 5;
  cube.position.z = (Math.random() - 0.5) * 20;

  cube.scale.y = Math.random() * 5 + 1;

  scene.add(cube);
  buildings.push(cube);
}

// Background color transition
function updateEnvironment(progress) {
  // Sky color transition (polluted → clean)
  let r = 0.1 + progress * 0.2;
  let g = 0.1 + progress * 0.5;
  let b = 0.1 + progress * 0.7;
  renderer.setClearColor(new THREE.Color(r, g, b));

  // Building color transition
  buildings.forEach((bld) => {
    bld.material.color.setRGB(
      0.3 + progress * 0.2,
      0.3 + progress * 0.7,
      0.3 + progress * 0.3
    );

    // Grow greenery
    bld.scale.y = 1 + progress * 6;
  });
}

// Scroll interaction
window.addEventListener("scroll", () => {
  let scrollY = window.scrollY;
  let maxScroll = document.body.scrollHeight - window.innerHeight;
  let progress = scrollY / maxScroll;

  updateEnvironment(progress);
});

// Animation loop
function animate() {
  requestAnimationFrame(animate);

  buildings.forEach((b) => {
    b.rotation.y += 0.001;
  });

  renderer.render(scene, camera);
}
animate();

// Resize
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
