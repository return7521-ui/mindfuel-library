<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Holi 2026 — a vibrant interactive celebration website exploring meaning, history, regional colors, stories, sounds, and joyful surprises."
    />
    <title>Holi 2026 • Rang Resonance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..900&family=Baloo+2:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles/base.css" />
    <link rel="stylesheet" href="/styles/animations.css" />
  </head>
  <body>
    <canvas id="powder-canvas" aria-hidden="true"></canvas>
    <div class="aurora" aria-hidden="true"></div>

    <header class="site-header glass">
      <p class="eyebrow">Once-in-history edition</p>
      <h1>
        <span class="wiggle">Holi</span>
        <span class="year">2026</span>
        <span class="spark">✨</span>
      </h1>
      <p class="tagline">Color. Memory. Mischief. Meaning.</p>
      <div class="controls" role="group" aria-label="Experience controls">
        <button id="motion-toggle" class="pill-btn" aria-pressed="false">Calm Motion</button>
        <button id="sound-toggle" class="pill-btn" aria-pressed="false">Enable Sound</button>
      </div>
    </header>

    <main id="app"></main>

    <footer class="site-footer glass">
      <p>Made for Holi 2026 — with joy, respect, and color on purpose.</p>
      <a
        href="https://instagram.com/shashank_404_"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Visit Instagram profile @shashank_404_"
      >
        Follow the color trail: @shashank_404_
      </a>
    </footer>

    <script type="module" src="/scripts/main.js"></script>
  </body>
</html>
