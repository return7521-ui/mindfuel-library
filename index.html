<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Future Sustainable City</title>

<style>
  body {
    margin: 0;
    overflow-x: hidden;
    font-family: 'Poppins', sans-serif;
    background: black;
    color: white;
  }

  canvas {
    position: fixed;
    top: 0;
    left: 0;
  }

  .scroll-container {
    height: 600vh;
  }

  .ui {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10;
  }

  .card {
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(15px);
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 10px;
  }

  .title {
    font-size: 22px;
    font-weight: bold;
  }

  .progress-bar {
    width: 200px;
    height: 5px;
    background: rgba(255,255,255,0.2);
    border-radius: 5px;
    overflow: hidden;
    margin-top: 10px;
  }

  .progress {
    height: 100%;
    width: 0%;
    background: lime;
  }
</style>
</head>

<body>

<div class="ui">
  <div class="card">
    <div class="title">🌍 Future City Engine</div>
    <div>Scroll to evolve the planet</div>
    <div class="progress-bar"><div class="progress"></div></div>
  </div>
</div>

<div class="scroll-container"></div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js";
import { EffectComposer } from "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/postprocessing/EffectComposer.js";
import { RenderPass } from "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/postprocessing/UnrealBloomPass.js";

// ================= SCENE =================
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 6, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// ================= POST PROCESSING =================
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.8,
  0.4,
  0.2
);
composer.addPass(bloomPass);

// ================= LIGHTING =================
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(10, 20, 10);
scene.add(sun);

const ambient = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambient);

// ================= CITY GENERATION =================
const buildings = [];
const trees = [];

function createBuilding(x, z) {
  const height = Math.random() * 5 + 2;

  const geometry = new THREE.BoxGeometry(1, height, 1);
  const material = new THREE.MeshStandardMaterial({
    color: 0x333333,
    metalness: 0.6,
    roughness: 0.5
  });

  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(x, height/2, z);

  scene.add(mesh);
  buildings.push(mesh);
}

function createTree(x, z) {
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.1, 0.1, 1),
    new THREE.MeshStandardMaterial({ color: 0x8b5a2b })
  );

  const leaves = new THREE.Mesh(
    new THREE.SphereGeometry(0.6),
    new THREE.MeshStandardMaterial({ color: 0x00ff88 })
  );

  trunk.position.set(x, 0.5, z);
  leaves.position.set(x, 1.5, z);

  scene.add(trunk);
  scene.add(leaves);

  trees.push(leaves);
}

// generate grid city
for (let x = -10; x < 10; x += 2) {
  for (let z = -10; z < 10; z += 2) {
    createBuilding(x, z);

    if (Math.random() > 0.7) {
      createTree(x, z);
    }
  }
}

// ================= GROUND =================
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ color: 0x111111 })
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// ================= SKY SYSTEM =================
const skyColor = new THREE.Color(0x111111);

// ================= SCROLL SYSTEM =================
let progress = 0;

window.addEventListener("scroll", () => {
  const scrollY = window.scrollY;
  const max = document.body.scrollHeight - window.innerHeight;
  progress = scrollY / max;

  document.querySelector(".progress").style.width = (progress*100)+"%";
});

// ================= ENVIRONMENT EVOLUTION =================
function evolveCity() {

  // SKY TRANSITION
  skyColor.setRGB(
    0.05 + progress * 0.2,
    0.05 + progress * 0.5,
    0.05 + progress * 0.9
  );
  renderer.setClearColor(skyColor);

  // SUN COLOR (pollution → clean)
  sun.intensity = 0.5 + progress * 2;

  // BUILDINGS EVOLVE
  buildings.forEach((b) => {
    b.scale.y = 1 + progress * 2;

    b.material.color.setRGB(
      0.2 + progress * 0.2,
      0.2 + progress * 0.6,
      0.2 + progress * 0.3
    );
  });

  // TREES GROW
  trees.forEach((t) => {
    t.scale.setScalar(progress * 1.5);
  });

  // CAMERA CINEMATIC MOTION
  camera.position.x = Math.sin(progress * Math.PI) * 10;
  camera.position.z = 12 - progress * 8;
  camera.lookAt(0,0,0);
}

// ================= HOTSPOT SYSTEM =================
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener("click", (event) => {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const intersects = raycaster.intersectObjects(buildings);

  if (intersects.length > 0) {
    const obj = intersects[0].object;
    obj.material.color.set(0x00ffcc);
  }
});

// ================= ANIMATION LOOP =================
function animate() {
  requestAnimationFrame(animate);

  evolveCity();

  composer.render();
}

animate();

// ================= RESIZE =================
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
