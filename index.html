<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Earth Odyssey | Interactive 3D Continents</title>
    <!-- Inline CSS for immediate styling (for production, move to style.css) -->
    <style>
        /* ----- GLOBAL DARK THEME & RESET ----- */
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', 'Poppins', 'Orbitron', 'Montserrat', sans-serif;
            color: #ffffff;
        }

        /* Info Panel - Sleek Glassmorphism Card */
        .info-panel {
            position: fixed;
            bottom: 30px;
            left: 30px;
            max-width: 320px;
            background: rgba(10, 20, 30, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 16px 24px;
            border-left: 4px solid #ff3366;
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 10;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .info-panel h3 {
            margin: 0 0 6px 0;
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, #fff, #ffb347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 1px;
        }
        .info-panel p {
            margin: 0;
            font-size: 0.95rem;
            line-height: 1.4;
            color: #f0f0f0;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        .info-panel .continent-name {
            font-weight: bold;
            color: #ffaa66;
        }
        /* subtle hint */
        .hint {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-family: monospace;
            letter-spacing: 1px;
            color: #ccc;
            z-index: 10;
            pointer-events: none;
        }
        /* Title Overlay */
        .title {
            position: fixed;
            top: 24px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 600;
            background: transparent;
            text-shadow: 0 0 12px rgba(0,0,0,0.7);
            pointer-events: none;
            z-index: 10;
            letter-spacing: 3px;
            color: #ffffffcc;
        }
        .title span {
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 0.9rem;
        }
        @media (max-width: 600px) {
            .info-panel { max-width: 260px; padding: 12px 18px; bottom: 20px; left: 20px; }
            .info-panel h3 { font-size: 1.2rem; }
            .title span { font-size: 0.7rem; }
        }
        /* loader (optional, appears while texture loads) */
        .loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #0a0f1a;
            padding: 14px 28px;
            border-radius: 60px;
            color: white;
            font-family: monospace;
            z-index: 100;
            border: 1px solid #ff3366;
            backdrop-filter: blur(8px);
            pointer-events: none;
            transition: opacity 1s ease;
        }
    </style>
</head>
<body>
    <div class="title"><span>✦ EARTH ODYSSEY • DISCOVER THE WORLD ✦</span></div>
    <div class="info-panel" id="infoPanel">
        <h3>✨ CONTINENTS</h3>
        <p>🌍 <span class="continent-name">Click on any glowing hotspot</span> — discover each continent's story.</p>
    </div>
    <div class="hint">✨ HOVER to highlight | CLICK for insights ✨</div>
    <div id="loadingOverlay" class="loader">🌐 LOADING EARTH TEXTURE ...</div>

    <!-- Three.js Core & Add-ons -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- SETUP SCENE, CAMERA, RENDERER (Dark immersive space) ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030318); // deep cosmic
        scene.fog = new THREE.FogExp2(0x030318, 0.0003); // subtle fog for depth

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0.5, 7);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true; // subtle shadows
        document.body.appendChild(renderer.domElement);

        // --- ORBIT CONTROLS (enables interactive exploration while Earth rotates) ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;      // smooth inertia
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.zoomSpeed = 1.2;
        controls.rotateSpeed = 0.8;
        controls.target.set(0, 0, 0);

        // --- LIGHTS: atmospheric & dramatic ---
        // Ambient light soft fill
        const ambientLight = new THREE.AmbientLight(0x222222);
        scene.add(ambientLight);
        // Main directional light (sunlight)
        const mainLight = new THREE.DirectionalLight(0xffeedd, 1.2);
        mainLight.position.set(5, 3, 5);
        mainLight.castShadow = true;
        mainLight.receiveShadow = false;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        scene.add(mainLight);
        // Fill light from below to illuminate darker side
        const fillLight = new THREE.PointLight(0x4466cc, 0.4);
        fillLight.position.set(0, -3, 0);
        scene.add(fillLight);
        // Back rim light for edges
        const rimLight = new THREE.PointLight(0xffaa66, 0.5);
        rimLight.position.set(-2, 1, -3);
        scene.add(rimLight);
        
        // small point light near earth for hotspot glow effect
        const warmGlow = new THREE.PointLight(0xff8844, 0.6);
        warmGlow.position.set(1, 1, 2);
        scene.add(warmGlow);

        // --- STARFIELD BACKGROUND (Particle System) ---
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 1800;
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPositions[i*3] = (Math.random() - 0.5) * 800;
            starPositions[i*3+1] = (Math.random() - 0.5) * 500;
            starPositions[i*3+2] = (Math.random() - 0.5) * 200 - 80;
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.25, transparent: true, opacity: 0.7 });
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);
        
        // second layer tiny stars
        const starGeometry2 = new THREE.BufferGeometry();
        const starCount2 = 800;
        const starPositions2 = new Float32Array(starCount2 * 3);
        for (let i = 0; i < starCount2; i++) {
            starPositions2[i*3] = (Math.random() - 0.5) * 1200;
            starPositions2[i*3+1] = (Math.random() - 0.5) * 800;
            starPositions2[i*3+2] = (Math.random() - 0.5) * 300 - 150;
        }
        starGeometry2.setAttribute('position', new THREE.BufferAttribute(starPositions2, 3));
        const starMaterial2 = new THREE.PointsMaterial({ color: 0xaaccff, size: 0.15, transparent: true, opacity: 0.5 });
        const stars2 = new THREE.Points(starGeometry2, starMaterial2);
        scene.add(stars2);
        
        // --- EARTH GROUP (rotates to simulate planet spin, holds both earth and hotspots) ---
        const earthGroup = new THREE.Group();
        scene.add(earthGroup);
        
        // Earth radius
        const earthRadius = 2.0;
        const hotspotRadius = 0.095;
        const hotspotOffset = 0.022; // slightly above surface
        
        // --- LOAD EARTH TEXTURE (high-res, beautiful) ---
        const textureLoader = new THREE.TextureLoader();
        // Using reliable high-res earth map from Three.js examples (diffuse + clouds effect)
        const earthMap = textureLoader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');
        const earthSpecularMap = textureLoader.load('https://threejs.org/examples/textures/planets/earth_specular_2048.jpg');
        const earthNormalMap = textureLoader.load('https://threejs.org/examples/textures/planets/earth_normal_2048.jpg');
        const cloudMap = textureLoader.load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png');
        
        // Earth material (Phong for specular highlights)
        const earthMaterial = new THREE.MeshPhongMaterial({
            map: earthMap,
            specularMap: earthSpecularMap,
            specular: new THREE.Color('grey'),
            shininess: 5,
            normalMap: earthNormalMap,
            normalScale: new THREE.Vector2(0.8, 0.8)
        });
        
        const earthMesh = new THREE.Mesh(new THREE.SphereGeometry(earthRadius, 128, 128), earthMaterial);
        earthGroup.add(earthMesh);
        
        // --- CLOUDS LAYER (transparent rotating slightly faster for ethereal effect) ---
        const cloudMaterial = new THREE.MeshPhongMaterial({
            map: cloudMap,
            transparent: true,
            opacity: 0.12,
            blending: THREE.AdditiveBlending
        });
        const cloudMesh = new THREE.Mesh(new THREE.SphereGeometry(earthRadius + 0.02, 128, 128), cloudMaterial);
        earthGroup.add(cloudMesh);
        
        // --- HOTSPOT DEFINITIONS: continent name, latitude, longitude, captivating description ---
        const continentsData = [
            { name: "NORTH AMERICA", lat: 45.0, lon: -100.0, desc: "🏔️ From the icy tundra of Canada to the vibrant cultures of the USA and Mexico. Home to towering skyscrapers, vast forests, and the Grand Canyon." },
            { name: "SOUTH AMERICA", lat: -15.0, lon: -60.0, desc: "🌿 The Amazon rainforest, the Andes mountains, and rich heritage. A land of biodiversity, tango, and ancient Incan wonders." },
            { name: "EUROPE", lat: 50.0, lon: 10.0, desc: "🏰 A tapestry of history, art, and innovation. From the Alps to Mediterranean coasts, castles, and timeless architecture." },
            { name: "AFRICA", lat: 0.0, lon: 20.0, desc: "🦁 The cradle of humankind — savannas, Sahara desert, vibrant wildlife, and rhythmic beats. A continent of unmatched spirit." },
            { name: "ASIA", lat: 30.0, lon: 100.0, desc: "🐉 The largest continent, diverse traditions, Himalayan peaks, futuristic cities, and ancient philosophies. Mystical and dynamic." },
            { name: "AUSTRALIA", lat: -25.0, lon: 135.0, desc: "🦘 Land down under, unique marsupials, the Great Barrier Reef, vast outback, and indigenous culture over 60,000 years old." },
            { name: "ANTARCTICA", lat: -82.0, lon: 0.0, desc: "❄️ The frozen frontier — pristine ice sheets, scientific research, and the planet's last true wilderness. Icy guardian of climate." }
        ];
        
        // Helper: convert lat/lon to Vector3 (radius + offset)
        function getPosition(lat, lon, radiusOffset = 0) {
            const phi = (90 - lat) * Math.PI / 180;
            const theta = lon * Math.PI / 180;
            const r = earthRadius + radiusOffset;
            const x = r * Math.sin(phi) * Math.cos(theta);
            const y = r * Math.cos(phi);
            const z = r * Math.sin(phi) * Math.sin(theta);
            return new THREE.Vector3(x, y, z);
        }
        
        // Store hotspot meshes for interactions
        const hotspots = [];
        
        // Create glowing hotspots with modern look: emissive spheres + tiny halo ring
        continentsData.forEach(continent => {
            const pos = getPosition(continent.lat, continent.lon, hotspotOffset);
            // Core glowing sphere
            const sphereMat = new THREE.MeshStandardMaterial({
                color: 0xff3366,
                emissive: 0xcc2244,
                emissiveIntensity: 0.65,
                roughness: 0.3,
                metalness: 0.1
            });
            const marker = new THREE.Mesh(new THREE.SphereGeometry(hotspotRadius, 24, 24), sphereMat);
            marker.position.copy(pos);
            marker.userData = {
                type: 'hotspot',
                continentName: continent.name,
                description: continent.desc,
                originalColor: 0xff3366,
                originalEmissive: 0xcc2244
            };
            earthGroup.add(marker);
            
            // add a subtle ring / orbitlet around hotspot to increase visibility
            const ringGeo = new THREE.TorusGeometry(hotspotRadius * 1.3, 0.018, 16, 40);
            const ringMat = new THREE.MeshStandardMaterial({ color: 0xffaa88, emissive: 0x442200, emissiveIntensity: 0.4 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.copy(pos);
            ring.userData = { parentHotspot: true };
            earthGroup.add(ring);
            
            // store both marker and ring (optional for hover fx)
            marker.ringRef = ring;
            hotspots.push(marker);
        });
        
        // --- ADD EXTRA ATMOSPHERIC GLOW (custom back outer glow) ---
        const glowMaterial = new THREE.MeshPhongMaterial({
            color: 0x2266aa,
            transparent: true,
            opacity: 0.08,
            side: THREE.BackSide
        });
        const atmosphereGlow = new THREE.Mesh(new THREE.SphereGeometry(earthRadius + 0.08, 64, 64), glowMaterial);
        earthGroup.add(atmosphereGlow);
        
        // --- INTERACTIVITY: Raycaster for hover and click ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        // DOM elements for description panel
        const infoPanel = document.getElementById('infoPanel');
        const panelTitle = infoPanel.querySelector('h3');
        const panelDesc = infoPanel.querySelector('p');
        
        // Helper to update info panel content
        function updatePanel(continent, description) {
            panelTitle.innerHTML = `🌍 ${continent}`;
            panelDesc.innerHTML = `<span class="continent-name">${continent}</span><br>${description}`;
            // add a subtle pop animation
            infoPanel.style.transform = 'scale(1.02)';
            setTimeout(() => { infoPanel.style.transform = 'scale(1)'; }, 180);
        }
        
        // reset panel to default after some time? we keep selected until next click (more intuitive)
        // But for user-friendliness, we set default after 6 seconds? Instead better to keep permanent but show new clicks.
        // Default welcome if no click? but we already have default, we will override on click.
        
        // Hover effect: highlight hotspots + cursor change
        let currentHovered = null;
        
        function onMouseMove(event) {
            // calculate mouse position in normalized coordinates
            mouse.x = (event.clientX / renderer.domElement.clientWidth) * 2 - 1;
            mouse.y = -(event.clientY / renderer.domElement.clientHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(hotspots);
            
            if (intersects.length > 0) {
                const hit = intersects[0].object;
                if (currentHovered !== hit) {
                    // reset previous hovered style
                    if (currentHovered) {
                        currentHovered.material.color.setHex(currentHovered.userData.originalColor);
                        currentHovered.material.emissiveIntensity = 0.65;
                        if (currentHovered.ringRef) currentHovered.ringRef.material.emissiveIntensity = 0.3;
                    }
                    currentHovered = hit;
                    // highlight
                    hit.material.color.setHex(0xffaa77);
                    hit.material.emissiveIntensity = 1.2;
                    if (hit.ringRef) hit.ringRef.material.emissiveIntensity = 0.8;
                    document.body.style.cursor = 'pointer';
                }
            } else {
                if (currentHovered) {
                    currentHovered.material.color.setHex(currentHovered.userData.originalColor);
                    currentHovered.material.emissiveIntensity = 0.65;
                    if (currentHovered.ringRef) currentHovered.ringRef.material.emissiveIntensity = 0.4;
                    currentHovered = null;
                    document.body.style.cursor = 'auto';
                }
            }
        }
        
        function onClick(event) {
            mouse.x = (event.clientX / renderer.domElement.clientWidth) * 2 - 1;
            mouse.y = -(event.clientY / renderer.domElement.clientHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(hotspots);
            
            if (intersects.length > 0) {
                const hotspotObj = intersects[0].object;
                const continent = hotspotObj.userData.continentName;
                const description = hotspotObj.userData.description;
                updatePanel(continent, description);
                // small extra: pulse effect on selected hotspot
                hotspotObj.material.emissiveIntensity = 1.5;
                setTimeout(() => {
                    if (hotspotObj === currentHovered) return;
                    hotspotObj.material.emissiveIntensity = 0.65;
                }, 300);
            }
        }
        
        // --- ANIMATION LOOP: rotate Earth group, clouds, stars subtle motion ---
        let earthRotationSpeed = 0.0022;
        let cloudRotationSpeed = 0.0026;
        
        // remove loading overlay after texture and scene stable
        setTimeout(() => {
            const loaderDiv = document.getElementById('loadingOverlay');
            if (loaderDiv) {
                loaderDiv.style.opacity = '0';
                setTimeout(() => { if(loaderDiv) loaderDiv.remove(); }, 1000);
            }
        }, 1500);
        
        // also ensure if texture fails, still functional
        function animate() {
            requestAnimationFrame(animate);
            
            // Rotate Earth Group for constant rotation (realistic spin)
            earthGroup.rotation.y += earthRotationSpeed;
            // rotate clouds slightly faster for drifting illusion
            cloudMesh.rotation.y += 0.0008;
            
            // subtle stars rotation for immersive parallax
            stars.rotation.y += 0.0001;
            stars.rotation.x += 0.00005;
            stars2.rotation.y -= 0.00007;
            
            // pulsating glow light near earth (dynamic)
            const time = Date.now() * 0.002;
            warmGlow.intensity = 0.55 + Math.sin(time) * 0.12;
            
            // Update controls and render
            controls.update(); // needed for damping even if no user input
            renderer.render(scene, camera);
        }
        
        // --- EVENT LISTENERS ---
        window.addEventListener('mousemove', onMouseMove, false);
        window.addEventListener('click', onClick, false);
        
        // Handle window resize
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Optional: add a subtle intro effect: zoom camera
        camera.position.set(0, 0.2, 7.8);
        controls.target.set(0, 0, 0);
        controls.update();
        
        // start animation
        animate();
        
        // Small console greeting
        console.log('🌍 3D Earth ready — click the glowing hotspots to explore continents!');
        
        // additional: make sure text panel default shows intro, but not overwritten
        // we set default fallback, but if clicked it updates.
    </script>
</body>
</html>
